name: Bug report
description: Report incorrect, unsafe, or inconsistent Skill behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the Skill. Remove secrets and personal data before submitting.
  - type: textarea
    id: prompt
    attributes:
      label: Prompt or input
      description: Provide the smallest input that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe the relevant output or failure. Redact sensitive material.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected invariant
      description: Explain what constraint or behavior should have held.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Agent client and model
      description: Include versions when known.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets, private data, and unlicensed source material.
          required: true
        - label: This report does not contain undisclosed security details.
          required: true
